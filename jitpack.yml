# JitPack's default JDK 8 is too old for Gradle here. openjdk21 is enough for this repository:
# the only toolchain it declares is :plugins at JDK 21, so the running JVM satisfies it and no
# JDK download is needed (consumer builds are what need JDK 25, and they provision it themselves).
jdk:
  - openjdk21
install:
  # JitPack's builder intermittently fails to resolve services.gradle.org, which the Gradle
  # wrapper contacts to download its pinned distribution. Retry the whole invocation a bounded
  # number of times: JitPack caches a failed build against the tag permanently, so a transient
  # network failure would otherwise burn the release version.
  - n=1; until ./gradlew --no-daemon publishToMavenLocal; do n=$((n+1)); if [ "$n" -gt 4 ]; then echo "gradle failed after 4 attempts"; exit 1; fi; echo "retrying, attempt $n"; sleep 20; done
