// The convention plugins. Precompiled Groovy script plugins: each src/main/groovy/*.gradle
// becomes a plugin whose id is the file's base name. Consumers resolve the plugin ids to this
// module via a settings resolutionStrategy (see README).
plugins {
    id 'groovy-gradle-plugin'
    id 'maven-publish'
}

group = 'com.github.damian1000.build-conventions'
version = rootProject.version

java {
    // The plugin JAR targets JDK 21, not 25: a Gradle plugin must load on whatever JVM Gradle
    // itself runs (17+), and JitPack builds consumers on 21 — a 25-bytecode plugin can't be loaded
    // there. This is the plugin module's own bytecode only; the convention scripts still set
    // languageVersion 25 for consumer code.
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    gradlePluginPortal()
    mavenCentral()
}

dependencies {
    // The real artifacts behind the plugin ids the convention plugins apply. A precompiled
    // script plugin can only `apply` a third-party plugin that is on this project's classpath.
    implementation 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.21'
    implementation 'com.diffplug.spotless:spotless-plugin-gradle:8.9.0'
    implementation 'org.owasp:dependency-check-gradle:12.2.2'

    // The same Jackson floor the convention plugins put under every consumer, applied here
    // because this project does not apply them to itself. dependency-check-gradle 12.2.2 — the
    // current release — resolves jackson-databind 2.21.3 through open-vulnerability-clients,
    // which 11 advisories cover, 3 of them high. Spotless is not a source of Jackson at all, so
    // the 8.9.0 upgrade does not address them.
    implementation platform('com.fasterxml.jackson:jackson-bom:2.22.1')

    constraints {
        // Same plugin, same shape of problem as the Jackson floor above. dependency-check-gradle
        // 12.2.2 resolves jsoup 1.22.2, which CVE-2026-71497 covers: Cleaner can be made to emit
        // markup through a custom raw-text element. Fixed in 1.23.1.
        //
        // jsoup publishes no BOM, so this is a constraint rather than a platform. It is the only
        // open advisory on the estate, and the exposure is bounded — this classpath is a Gradle
        // plugin's, so nothing here reaches a running service, and the affected API is the HTML
        // sanitiser, which neither this project nor dependency-check uses on untrusted input.
        // Raised anyway: an advisory that is reasoned away rather than fixed has to be reasoned
        // away again every time somebody reads the alert.
        implementation('org.jsoup:jsoup:1.23.1') {
            because 'CVE-2026-71497 affects jsoup >= 1.14.3, < 1.23.1 via dependency-check-gradle'
        }
    }
}
