// Shared Java build conventions for the damian1000 repositories: JDK 25 toolchain, the 90% JaCoCo
// instruction gate, Spotless (JDK-agnostic Java hygiene + Prettier for config/docs), OWASP
// dependency-check, and the JUnit 6 test wiring. A consumer applies this plugin and declares only
// what is specific to it.
plugins {
    id 'java'
    id 'jacoco'
    id 'com.diffplug.spotless'
    id 'org.owasp.dependencycheck'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    // Jackson arrives transitively — kafka-streams 4.3.1 resolves jackson-databind 2.21.2, which
    // CVE-2026-54512 and CVE-2026-54513 (CVSS 8.1) escape BasicPolymorphicTypeValidator on. Both
    // are fixed in 2.21.4. A BOM is a floor rather than a pin: Gradle takes the highest of the
    // competing constraints, so a repository whose own BOM already resolves higher is unaffected,
    // and the modules stay aligned instead of drifting apart across the 2.21 line.
    implementation platform('com.fasterxml.jackson:jackson-bom:2.21.5')

    testImplementation platform('org.junit:junit-bom:6.1.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Codecov rejects a coverage report whose embedded JaCoCo session timestamp is more than 12 hours
// old. A build-cache hit restores execution data stamped from whenever the tests last genuinely
// ran, so a commit that leaves test inputs untouched — a dependency bump, a settings change —
// uploads a report dated days earlier and the coverage badge goes stale. The execution data has to
// come from this build, so the two tasks that produce it are excluded from the cache.
// Testcontainers suites are skipped when no Docker daemon is reachable, so `test` goes green and
// jacocoTestCoverageVerification then fails on a percentage that measured a fraction of the suite.
// That reads as "the build is broken" to anyone who does not already know Docker was missing.
def dockerCheckEnabled = !providers.gradleProperty('conventions.skipDockerCheck').present

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
    outputs.cacheIf { false }
}

// Deferred: the consumer declares its dependencies after this plugin is applied, so whether the
// project uses Testcontainers is not yet knowable here.
afterEvaluate {
    def declaresTestcontainers = ['testImplementation', 'testRuntimeOnly'].any { name ->
        configurations.findByName(name)?.dependencies?.any { it.group == 'org.testcontainers' }
    }
    if (!declaresTestcontainers || !dockerCheckEnabled) {
        return
    }
    tasks.named('test') {
        doFirst {
            def reachable = false
            try {
                // Output goes to the null device rather than a pipe: closing a pipe the daemon is
                // still writing to kills `docker info` with EPIPE and reads as "no Docker".
                def probe = new ProcessBuilder('docker', 'info', '--format', '{{.ServerVersion}}')
                        .redirectErrorStream(true)
                        .redirectOutput(ProcessBuilder.Redirect.DISCARD)
                        .start()
                reachable = probe.waitFor(30, java.util.concurrent.TimeUnit.SECONDS) && probe.exitValue() == 0
                if (probe.alive) {
                    probe.destroyForcibly()
                }
            } catch (IOException ignored) {
                reachable = false // no docker on PATH
            }
            if (!reachable) {
                throw new GradleException(
                        'No reachable Docker daemon. This project has Testcontainers suites, which would be ' +
                        'silently skipped, and the coverage gate would then fail on a percentage that did not ' +
                        'measure them. Start Docker, or pass -Pconventions.skipDockerCheck to run the rest of ' +
                        'the suite knowingly without them.')
            }
        }
    }
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    outputs.cacheIf { false }
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('jacocoTestReport')
    violationRules {
        rule {
            limit {
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = 0.90
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}

spotless {
    java {
        target 'src/**/*.java'
        // Structural formatters (google-java-format / palantir-java-format) rely on internal
        // javac APIs that changed in JDK 25; JDK-agnostic hygiene rules until upstream catches up.
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
    // Config/docs (YAML workflows, Markdown) held to the same bar. Needs Node on PATH for Prettier.
    format 'config', {
        target '.github/**/*.yml', '.github/**/*.yaml', '*.md'
        prettier('3.4.2')
        trimTrailingWhitespace()
        endWithNewline()
    }
}

// OWASP dependency vulnerability scanner. Fails the build on any dependency with CVSS >= 7.0.
// The NVD API throttles unauthenticated callers to the point where an update run takes tens of
// minutes and starts returning 403s, so CI passes NVD_API_KEY. A local run without one still
// works; it is only slow.
def nvdApiKey = providers.environmentVariable('NVD_API_KEY').orNull

dependencyCheck {
    failBuildOnCVSS = 7.0f
    formats = ['HTML', 'JSON']
    // Scan what the application ships rather than every configuration, so build-time toolchain
    // jars do not fail an application scan for something it does not deploy. Platform-level
    // advisories surface in build-conventions' own scan, where the versions are chosen.
    scanConfigurations = ['runtimeClasspath']
    if (nvdApiKey) {
        nvd {
            apiKey = nvdApiKey
            // NVD answers 429 once a key's budget is spent, and the client's default of 10
            // retries gives up while the throttle is still on — which fails the build on a
            // transient condition and reads as a security finding in the notification. The
            // delay is left at its default so a warm incremental update stays fast; the real
            // protection against exhausting the budget is not downloading the feed from cold.
            maxRetryCount = 30
        }
    }
    analyzers {
        assemblyEnabled = false
        nodeEnabled = false
        nodeAuditEnabled = false
        nuspecEnabled = false
    }
}
