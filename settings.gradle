plugins {
    // Provisions the JDK 25 toolchain on machines/builders that lack it (e.g. JitPack).
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'build-conventions'

// The root project is the convention plugins (so the com.github.damian1000:build-conventions
// coordinate consumers' pluginManagement maps to is the plugin jar); :catalog publishes the
// shared version catalog, served by JitPack as com.github.damian1000.build-conventions:catalog.
include ':catalog'
