plugins {
    // Provisions the JDK 25 toolchain on machines/builders that lack it (e.g. JitPack).
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'build-conventions'

// :plugins publishes the convention plugins, :catalog the shared version catalog. JitPack
// serves multi-module builds under the dotted group, so consumers reference
// com.github.damian1000.build-conventions:plugins and :catalog.
include ':plugins', ':catalog'
