plugins {
    // Precompiled Groovy script plugins: each src/main/groovy/*.gradle becomes a plugin
    // whose id is the file's base name.
    id 'groovy-gradle-plugin'
    id 'maven-publish'
}

// JitPack publishes under com.github.<user>; the convention plugins resolve to this module
// via a settings resolutionStrategy in each consumer (see README).
group = 'com.github.damian1000'
version = '0.2.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    gradlePluginPortal()
    mavenCentral()
}

dependencies {
    // The real artifacts behind the plugin ids the convention plugins apply. A precompiled
    // script plugin can only `apply` a third-party plugin that is on this project's classpath.
    implementation 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.21'
    implementation 'com.diffplug.spotless:spotless-plugin-gradle:8.8.0'
    implementation 'org.owasp:dependency-check-gradle:12.2.2'
}
