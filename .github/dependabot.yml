version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # Consumers inherit this Kotlin version. CodeQL no longer caps it — github/codeql#21938
      # closed 2026-07-08 and CI runs CodeQL 2.26.1, which supports Kotlin 2.4. Two things now
      # hold the pin: CVE-2026-53914 (GHSA-r937-wjx7-w2jp) is fixed in 2.4.20, which has no GA
      # release (Maven Central's newest is 2.4.20-Beta2), so 2.4.10 is no less vulnerable than
      # 2.3.21; and ktlint 1.5.0 fails under 2.4.10 with NoClassDefFoundError on
      # EditorConfigDefaults, while even ktlint 1.8.0 still embeds the Kotlin 2.2.21 compiler.
      # Bump when 2.4.20 ships GA, together with a ktlint version that supports it.
      - dependency-name: "org.jetbrains.kotlin:kotlin-gradle-plugin"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
